<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie同意バナーの例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 28px 32px; max-width: 480px; width: 100%;
  }
  h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 20px; text-align: center; }
  .banner {
    border: 2px solid #e2e8f0; border-radius: 10px; padding: 22px 24px;
    background: #fafbfc;
  }
  .banner-title { font-size: 15px; font-weight: 700; color: #2d3748; margin-bottom: 16px; }
  .cookie-option {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; font-size: 14px; color: #4a5568;
  }
  .cookie-option input[type="checkbox"] { width: 18px; height: 18px; accent-color: #3182ce; }
  .cookie-option .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 4px;
  }
  .tag-required { background: #bee3f8; color: #2b6cb0; }
  .tag-optional { background: #fed7d7; color: #c53030; }
  .buttons { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 10px 0; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
  }
  .btn-accept { background: #3182ce; color: #fff; }
  .btn-settings { background: #e2e8f0; color: #4a5568; }
  .btn-reject { background: #fff; color: #e53e3e; border: 2px solid #fed7d7; }
</style>
</head>
<body>
<div class="card" id="diagram">
  <h2>🍪 Cookie同意バナーの例</h2>
  <div class="banner">
    <div class="banner-title">このサイトはCookieを使用します</div>
    <label class="cookie-option">
      <input type="checkbox" checked disabled>
      必須Cookie <span class="tag tag-required">同意不要</span>
    </label>
    <label class="cookie-option">
      <input type="checkbox">
      分析Cookie <span class="tag tag-optional">同意必要</span>
    </label>
    <label class="cookie-option">
      <input type="checkbox">
      広告Cookie <span class="tag tag-optional">同意必要</span>
    </label>
    <div class="buttons">
      <button class="btn btn-accept">すべて同意</button>
      <button class="btn btn-settings">設定</button>
      <button class="btn btn-reject">拒否</button>
    </div>
  </div>
</div>
</body>
</html>
