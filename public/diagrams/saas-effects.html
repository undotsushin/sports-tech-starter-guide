<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS導入による効果</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .card:nth-child(1) { border-top: 4px solid #4285f4; }
  .card:nth-child(2) { border-top: 4px solid #0176d3; }
  .card:nth-child(3) { border-top: 4px solid #95bf47; }
  .card-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 12px; }
  .stat { margin-bottom: 8px; }
  .stat-label { font-size: 11px; color: #777; }
  .stat-value { font-size: 18px; font-weight: 700; color: #1a73e8; }
</style>
</head>
<body>
<div id="diagram">
  <h2>SaaS導入による効果（実例）</h2>
  <div class="cards">
    <div class="card">
      <div class="card-title">Slack導入</div>
      <div class="stat">
        <div class="stat-label">メール削減</div>
        <div class="stat-value">48%</div>
      </div>
      <div class="stat">
        <div class="stat-label">会議時間削減</div>
        <div class="stat-value">23%</div>
      </div>
      <div class="stat">
        <div class="stat-label">意思決定スピード</div>
        <div class="stat-value">2倍</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Salesforce導入</div>
      <div class="stat">
        <div class="stat-label">営業生産性</div>
        <div class="stat-value">37%向上</div>
      </div>
      <div class="stat">
        <div class="stat-label">顧客満足度</div>
        <div class="stat-value">45%向上</div>
      </div>
      <div class="stat">
        <div class="stat-label">売上</div>
        <div class="stat-value">平均27%増加</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Shopify導入</div>
      <div class="stat">
        <div class="stat-label">ECサイト立ち上げ</div>
        <div class="stat-value">1日</div>
      </div>
      <div class="stat">
        <div class="stat-label">初期費用</div>
        <div class="stat-value">90%削減</div>
      </div>
      <div class="stat">
        <div class="stat-label">コンバージョン率</div>
        <div class="stat-value">平均3.5%</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
