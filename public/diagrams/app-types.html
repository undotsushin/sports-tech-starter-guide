<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 40px; background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
  .container { max-width: 560px; margin: 0 auto; }
  .title { text-align: center; font-size: 16px; font-weight: bold; color: #333; margin-bottom: 24px; }
  .row { margin-bottom: 24px; }
  .row-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 4px; }
  .row-title { text-align: center; font-weight: bold; font-size: 14px; color: #333; margin-bottom: 6px; }
  .bar { height: 14px; border-radius: 7px; position: relative; }
  .bar-cost { background: linear-gradient(to right, #a5d6a7, #ef9a9a); }
  .bar-perf { background: linear-gradient(to right, #ef9a9a, #a5d6a7); }
  .dots { display: flex; justify-content: space-between; padding: 0 6px; margin-top: 8px; }
  .dot-item { text-align: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; margin: 0 auto 4px; }
  .dot-label { font-size: 13px; font-weight: bold; color: #333; }
</style>
</head>
<body>
<div class="container">
  <div class="title">アプリの種類の比較</div>

  <div class="row">
    <div class="row-title">開発コスト</div>
    <div class="row-label"><span>低い</span><span>高い</span></div>
    <div class="bar bar-cost"></div>
    <div class="dots">
      <div class="dot-item"><div class="dot"></div><div class="dot-label">Web</div></div>
      <div class="dot-item"><div class="dot"></div><div class="dot-label">PWA</div></div>
      <div class="dot-item"><div class="dot"></div><div class="dot-label">ハイブリッド</div></div>
      <div class="dot-item"><div class="dot"></div><div class="dot-label">ネイティブ</div></div>
    </div>
  </div>

  <div class="row">
    <div class="row-title">性能</div>
    <div class="row-label"><span>低い</span><span>高い</span></div>
    <div class="bar bar-perf"></div>
    <div class="dots">
      <div class="dot-item"><div class="dot"></div><div class="dot-label">Web</div></div>
      <div class="dot-item"><div class="dot"></div><div class="dot-label">PWA</div></div>
      <div class="dot-item"><div class="dot"></div><div class="dot-label">ハイブリッド</div></div>
      <div class="dot-item"><div class="dot"></div><div class="dot-label">ネイティブ</div></div>
    </div>
  </div>
</div>
</body>
</html>
