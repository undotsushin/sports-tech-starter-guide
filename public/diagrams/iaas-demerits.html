<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IaaSのデメリット</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #d93025; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 16px;
    border-left: 4px solid #d93025;
  }
  .card-num { font-size: 12px; color: #d93025; font-weight: 700; margin-bottom: 4px; }
  .card-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 6px; }
  .card-desc { font-size: 12px; color: #555; line-height: 1.5; }
  .card-arrow { font-size: 12px; color: #d93025; margin-top: 6px; }
</style>
</head>
<body>
<div id="diagram">
  <h2>IaaSのデメリット</h2>
  <div class="cards">
    <div class="card">
      <div class="card-num">1</div>
      <div class="card-title">サーバー管理が必要</div>
      <div class="card-desc">セキュリティ更新、バックアップ、監視など自分で行う</div>
      <div class="card-arrow">→ 専門知識が必要</div>
    </div>
    <div class="card">
      <div class="card-num">2</div>
      <div class="card-title">運用コストがかかる</div>
      <div class="card-desc">エンジニアの人件費が必要</div>
      <div class="card-arrow">→ 月30万円〜の人件費</div>
    </div>
    <div class="card">
      <div class="card-num">3</div>
      <div class="card-title">設定が複雑</div>
      <div class="card-desc">ネットワーク、セキュリティなどの設定が複雑</div>
      <div class="card-arrow">→ 学習コストが高い</div>
    </div>
  </div>
</div>
</body>
</html>
