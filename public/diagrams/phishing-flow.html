<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フィッシング詐欺のフロー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 28px 32px; max-width: 560px; width: 100%;
  }
  h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 22px; text-align: center; }
  .step {
    display: flex; gap: 14px; align-items: flex-start;
  }
  .step-num {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .step1 .step-num { background: #e53e3e; }
  .step2 .step-num { background: #dd6b20; }
  .step3 .step-num { background: #9b2c2c; }
  .step-content { flex: 1; }
  .step-title { font-size: 15px; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
  .step-body {
    background: #fff5f5; border: 1px solid #fed7d7; border-radius: 8px;
    padding: 12px 14px; font-size: 13px; color: #4a5568; line-height: 1.7;
  }
  .step-body .fake-url { color: #e53e3e; font-weight: 600; }
  .step-body .real-url { color: #38a169; font-weight: 600; }
  .arrow {
    display: flex; justify-content: center; padding: 8px 0;
  }
  .arrow span {
    display: block; font-size: 22px; color: #a0aec0;
  }
  .result {
    background: #9b2c2c; color: #fff; border-radius: 8px;
    padding: 10px 16px; text-align: center; font-size: 14px; font-weight: 600;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="card" id="diagram">
  <h2>🎣 フィッシング詐欺のフロー</h2>

  <div class="step step1">
    <div class="step-num">1</div>
    <div class="step-content">
      <div class="step-title">偽メールが届く</div>
      <div class="step-body">
        件名: <strong>[重要] アカウントが不正利用されています！</strong><br>
        本文: すぐにログインして確認してください<br>
        → <span class="fake-url">https://amaz0n.com/login</span><br>
        <span style="font-size:12px;">（本物は <span class="real-url">amazon.com</span>）</span>
      </div>
    </div>
  </div>

  <div class="arrow"><span>▼</span></div>

  <div class="step step2">
    <div class="step-num">2</div>
    <div class="step-content">
      <div class="step-title">偽サイトに誘導</div>
      <div class="step-body">
        本物そっくりの偽ログイン画面が表示される
      </div>
    </div>
  </div>

  <div class="arrow"><span>▼</span></div>

  <div class="step step3">
    <div class="step-num">3</div>
    <div class="step-content">
      <div class="step-title">情報を入力してしまう</div>
      <div class="result">⚠️ パスワードが盗まれる</div>
    </div>
  </div>
</div>
</body>
</html>
