<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaSを選ぶべきケース</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .section { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; }
  .section.good { border-top: 4px solid #34a853; }
  .section.bad { border-top: 4px solid #d93025; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .section.good .section-title { color: #34a853; }
  .section.bad .section-title { color: #d93025; }
  .item { margin-bottom: 10px; }
  .item-title { font-size: 13px; font-weight: 600; color: #333; }
  .item-desc { font-size: 12px; color: #777; margin-top: 2px; }
</style>
</head>
<body>
<div id="diagram">
  <h2>SaaSを選ぶべきケース</h2>
  <div class="sections">
    <div class="section good">
      <div class="section-title">&#9675; こんな時はSaaS</div>
      <div class="item">
        <div class="item-title">1. すぐに業務を始めたい</div>
        <div class="item-desc">例: 明日から使いたい</div>
      </div>
      <div class="item">
        <div class="item-title">2. IT部門がない</div>
        <div class="item-desc">例: 小規模企業、個人事業主</div>
      </div>
      <div class="item">
        <div class="item-title">3. 標準的な業務</div>
        <div class="item-desc">例: 会計、メール、チャット</div>
      </div>
      <div class="item">
        <div class="item-title">4. 初期費用を抑えたい</div>
        <div class="item-desc">例: スタートアップ</div>
      </div>
      <div class="item">
        <div class="item-title">5. リモートワーク</div>
        <div class="item-desc">例: 複数拠点で作業</div>
      </div>
    </div>
    <div class="section bad">
      <div class="section-title">&#215; こんな時はSaaS以外</div>
      <div class="item">
        <div class="item-title">1. 特殊な業務フロー</div>
        <div class="item-desc">→ 独自開発が必要</div>
      </div>
      <div class="item">
        <div class="item-title">2. 超高度なカスタマイズ</div>
        <div class="item-desc">→ IaaS/PaaSで開発</div>
      </div>
      <div class="item">
        <div class="item-title">3. オフラインで使いたい</div>
        <div class="item-desc">→ デスクトップアプリ</div>
      </div>
      <div class="item">
        <div class="item-title">4. データを絶対に外部に出せない</div>
        <div class="item-desc">→ オンプレミス</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
