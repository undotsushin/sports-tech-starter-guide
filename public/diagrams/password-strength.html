<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 16px; text-align: center; }
table { width: 100%; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
th { background: #1976d2; color: #fff; padding: 10px 12px; font-size: 13px; text-align: left; }
td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #eee; }
tr:last-child td { border-bottom: none; }
.pw { font-family: 'Courier New', monospace; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
.worst { background: #ffcdd2; color: #b71c1c; }
.danger { background: #ffcdd2; color: #c62828; }
.weak { background: #fff9c4; color: #f57f17; }
.ok { background: #c8e6c9; color: #2e7d32; }
.strong { background: #a5d6a7; color: #1b5e20; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>パスワード強度の比較</h2>
  <table>
    <thead>
      <tr><th>パスワード</th><th>解読時間</th><th>評価</th></tr>
    </thead>
    <tbody>
      <tr><td class="pw">password</td><td>1秒以下</td><td><span class="badge worst">× 最悪</span></td></tr>
      <tr><td class="pw">password123</td><td>1秒以下</td><td><span class="badge danger">× 危険</span></td></tr>
      <tr><td class="pw">Password123!</td><td>3時間</td><td><span class="badge weak">△ 弱い</span></td></tr>
      <tr><td class="pw">P@ssw0rd!2024</td><td>3年</td><td><span class="badge ok">○ 普通</span></td></tr>
      <tr><td class="pw">Kj8$mP2#qL9@nR4!</td><td>7億年</td><td><span class="badge strong">◎ 強い</span></td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
