<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 40px; background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
  .container { max-width: 520px; margin: 0 auto; }
  .cards { display: flex; gap: 20px; margin-bottom: 16px; }
  .card { flex: 1; border-radius: 10px; overflow: hidden; }
  .card-iaas { border: 2px solid #e65100; }
  .card-paas { border: 2px solid #1565c0; }
  .card-title { padding: 10px; text-align: center; font-weight: bold; font-size: 15px; color: white; }
  .title-iaas { background: #e65100; }
  .title-paas { background: #1565c0; }
  .layer { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
  .layer:last-child { border-bottom: none; }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  .tag-self { background: #fff3e0; color: #e65100; }
  .tag-auto { background: #e8f5e9; color: #2e7d32; }
  .tag-rent { background: #f5f5f5; color: #666; }
  .summary { display: flex; gap: 20px; }
  .sum-item { flex: 1; font-size: 12px; color: #555; padding: 10px; background: white; border-radius: 8px; border: 1px solid #e0e0e0; }
  .sum-label { font-weight: bold; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="cards">
    <div class="card card-iaas">
      <div class="card-title title-iaas">IaaS</div>
      <div class="layer">アプリ <span class="tag tag-self">自分</span></div>
      <div class="layer">OS <span class="tag tag-self">自分で管理</span></div>
      <div class="layer">サーバー <span class="tag tag-rent">借りる</span></div>
    </div>
    <div class="card card-paas">
      <div class="card-title title-paas">PaaS</div>
      <div class="layer">アプリ <span class="tag tag-self">自分</span></div>
      <div class="layer">OS・ミドルウェア <span class="tag tag-auto">自動管理</span></div>
      <div class="layer">サーバー <span class="tag tag-rent">借りる</span></div>
    </div>
  </div>
  <div class="summary">
    <div class="sum-item"><div class="sum-label">IaaS:</div>サーバー設定、OS更新、セキュリティ対策を自分で</div>
    <div class="sum-item"><div class="sum-label">PaaS:</div>コードを書くだけ、インフラは全自動</div>
  </div>
</div>
</body>
</html>
