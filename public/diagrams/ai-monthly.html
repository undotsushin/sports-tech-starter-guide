<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 40px; background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
  .container { max-width: 540px; margin: 0 auto; }
  .title { font-size: 14px; color: #666; text-align: center; margin-bottom: 16px; }
  .cards { display: flex; gap: 20px; }
  .card { flex: 1; border-radius: 10px; padding: 16px; }
  .card-before { background: #ffebee; border: 2px solid #c62828; }
  .card-after { background: #e3f2fd; border: 2px solid #1565c0; }
  .card-title { font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 12px; }
  .title-before { color: #c62828; }
  .title-after { color: #1565c0; }
  .item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 12px; color: #333; }
  .total { display: flex; justify-content: space-between; padding: 8px 0 0; font-size: 14px; font-weight: bold; color: #333; border-top: 2px solid rgba(0,0,0,0.1); margin-top: 4px; }
  .time { font-weight: bold; }
  .results { margin-top: 12px; padding: 12px; background: #e8f5e9; border-radius: 8px; font-size: 12px; color: #2e7d32; line-height: 1.8; }
  .results strong { font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <div class="title">営業担当者の場合（月次比較）</div>
  <div class="cards">
    <div class="card card-before">
      <div class="card-title title-before">AI活用前</div>
      <div class="item"><span>提案書</span><span class="time">8h</span></div>
      <div class="item"><span>メール</span><span class="time">3h</span></div>
      <div class="item"><span>資料作成</span><span class="time">5h</span></div>
      <div class="item"><span>情報収集</span><span class="time">4h</span></div>
      <div class="total"><span>合計</span><span>20h</span></div>
    </div>
    <div class="card card-after">
      <div class="card-title title-after">AI活用後</div>
      <div class="item"><span>提案書</span><span class="time">2h</span></div>
      <div class="item"><span>メール</span><span class="time">0.5h</span></div>
      <div class="item"><span>資料作成</span><span class="time">1h</span></div>
      <div class="item"><span>情報収集</span><span class="time">1h</span></div>
      <div class="total"><span>合計</span><span>4.5h</span></div>
    </div>
  </div>
  <div class="results">
    <strong>削減時間: 15.5時間/月（77%削減）</strong><br>
    → 年間186時間削減<br>
    → 月7.5時間を新規営業に充当<br>
    → 売上30%増加
  </div>
</div>
</body>
</html>
