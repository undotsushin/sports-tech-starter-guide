<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaaSのデメリット</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #d93025; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 16px;
    border-left: 4px solid #d93025;
  }
  .card-num { font-size: 12px; color: #d93025; font-weight: 700; margin-bottom: 4px; }
  .card-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 6px; }
  .card-desc { font-size: 12px; color: #555; line-height: 1.5; }
  .card-arrow { font-size: 12px; color: #d93025; margin-top: 6px; }
</style>
</head>
<body>
<div id="diagram">
  <h2>PaaSのデメリット</h2>
  <div class="cards">
    <div class="card">
      <div class="card-num">1</div>
      <div class="card-title">カスタマイズに制限</div>
      <div class="card-desc">特殊なミドルウェアは使えない</div>
      <div class="card-arrow">→ 標準的な構成のみ</div>
    </div>
    <div class="card">
      <div class="card-num">2</div>
      <div class="card-title">ベンダーロックイン</div>
      <div class="card-desc">プラットフォームに依存する</div>
      <div class="card-arrow">→ 他社への移行が大変</div>
    </div>
    <div class="card">
      <div class="card-num">3</div>
      <div class="card-title">大規模になるとコスト高</div>
      <div class="card-desc">月間100万PV超えるとIaaSより高くなることも</div>
      <div class="card-arrow">→ 規模に応じてIaaSへ移行検討</div>
    </div>
    <div class="card">
      <div class="card-num">4</div>
      <div class="card-title">パフォーマンスの限界</div>
      <div class="card-desc">細かいチューニングができない</div>
      <div class="card-arrow">→ 超高速化は難しい</div>
    </div>
  </div>
</div>
</body>
</html>
