<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 16px; text-align: center; }
.items { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.items li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; color: #333; }
.check { color: #1976d2; font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>プライバシーポリシーの必須項目</h2>
  <ul class="items">
    <li><span class="check">☐</span>事業者の名称・住所</li>
    <li><span class="check">☐</span>個人情報の利用目的</li>
    <li><span class="check">☐</span>第三者提供の有無</li>
    <li><span class="check">☐</span>開示請求の方法</li>
    <li><span class="check">☐</span>問い合わせ窓口</li>
    <li><span class="check">☐</span>Cookie等の利用</li>
    <li><span class="check">☐</span>安全管理措置</li>
  </ul>
</div>
</body>
</html>
