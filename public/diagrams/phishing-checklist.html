<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 16px; text-align: center; }
.items { list-style: none; }
.items li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 6px; background: #e8f5e9; border-radius: 8px; font-size: 14px; color: #333; }
.check { color: #2e7d32; font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>フィッシング対策チェックリスト</h2>
  <ul class="items">
    <li><span class="check">☐</span>メールのリンクを直接クリックしない</li>
    <li><span class="check">☐</span>公式サイトをブックマークしておく</li>
    <li><span class="check">☐</span>URLを必ず確認する</li>
    <li><span class="check">☐</span>二要素認証を有効化する</li>
    <li><span class="check">☐</span>不審なメールは開かない</li>
  </ul>
</div>
</body>
</html>
