<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料金例（AWS EC2）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .card:nth-child(1) { border-top: 4px solid #34a853; }
  .card:nth-child(2) { border-top: 4px solid #fbbc04; }
  .card:nth-child(3) { border-top: 4px solid #ea4335; }
  .card-label { font-size: 11px; color: #777; margin-bottom: 4px; }
  .card-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; }
  .card-price { font-size: 20px; font-weight: 700; color: #1a73e8; margin-bottom: 8px; }
  .card-price span { font-size: 12px; font-weight: 400; color: #777; }
  .card-specs { font-size: 12px; color: #555; line-height: 1.6; }
</style>
</head>
<body>
<div id="diagram">
  <h2>料金例（AWS EC2の場合）</h2>
  <div class="cards">
    <div class="card">
      <div class="card-label">月間1万PV</div>
      <div class="card-title">小規模サイト</div>
      <div class="card-price">月1,000円</div>
      <div class="card-specs">
        インスタンス: t2.micro<br>
        CPU 1コア / メモリ1GB
      </div>
    </div>
    <div class="card">
      <div class="card-label">月間100万PV</div>
      <div class="card-title">中規模サイト</div>
      <div class="card-price">月5,000円</div>
      <div class="card-specs">
        インスタンス: t3.medium<br>
        CPU 2コア / メモリ4GB
      </div>
    </div>
    <div class="card">
      <div class="card-label">月間1,000万PV</div>
      <div class="card-title">大規模サイト</div>
      <div class="card-price">月50,000円</div>
      <div class="card-specs">
        インスタンス: c5.xlarge &times; 3台<br>
        CPU 4コア &times; 3 / メモリ8GB &times; 3
      </div>
    </div>
  </div>
</div>
</body>
</html>
