<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 16px; text-align: center; }
.flow { display: flex; align-items: center; justify-content: center; gap: 12px; }
.box { background: #e3f2fd; border-radius: 10px; padding: 14px 18px; font-size: 14px; color: #1565c0; text-align: center; flex: 1; }
.arrow { font-size: 24px; color: #1976d2; flex-shrink: 0; }
.note { margin-top: 12px; font-size: 13px; color: #666; text-align: center; background: #f5f5f5; border-radius: 8px; padding: 10px; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>開示請求への対応</h2>
  <div class="flow">
    <div class="box">ユーザーから<br>「自分の情報を見せて」</div>
    <div class="arrow">→</div>
    <div class="box">本人確認</div>
    <div class="arrow">→</div>
    <div class="box">原則として<br>開示が必要</div>
  </div>
  <div class="note">ユーザーからの開示請求には、本人確認後に対応する義務があります</div>
</div>
</body>
</html>
