<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料金比較 チャットツール</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
  }
  .card:nth-child(1) { border-top: 4px solid #34a853; }
  .card:nth-child(2) { border-top: 4px solid #ea4335; }
  .card-type { font-size: 11px; color: #777; margin-bottom: 2px; }
  .card-title { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 12px; }
  .card-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
  .card-row:last-child { border-bottom: none; }
  .row-label { color: #777; }
  .row-value { color: #333; font-weight: 600; }
  .total {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 2px solid #e0e0e0;
    text-align: right;
  }
  .total-label { font-size: 11px; color: #777; }
  .total-value { font-size: 20px; font-weight: 700; color: #1a73e8; }
  .conclusion {
    background: #e6f4ea;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    color: #34a853;
    text-align: center;
  }
</style>
</head>
<body>
<div id="diagram">
  <h2>チャットツールの料金比較（3年間）</h2>
  <div class="cards">
    <div class="card">
      <div class="card-type">SaaS</div>
      <div class="card-title">Slack</div>
      <div class="card-row"><span class="row-label">月額</span><span class="row-value">850円 &times; 100人 = 85,000円</span></div>
      <div class="card-row"><span class="row-label">初期費用</span><span class="row-value">0円</span></div>
      <div class="card-row"><span class="row-label">管理</span><span class="row-value">不要</span></div>
      <div class="total">
        <div class="total-label">3年間合計</div>
        <div class="total-value">306万円</div>
      </div>
    </div>
    <div class="card">
      <div class="card-type">独自開発（IaaS）</div>
      <div class="card-title">自社構築</div>
      <div class="card-row"><span class="row-label">開発費</span><span class="row-value">500万円</span></div>
      <div class="card-row"><span class="row-label">サーバー代</span><span class="row-value">月5万円</span></div>
      <div class="card-row"><span class="row-label">保守費用</span><span class="row-value">月10万円</span></div>
      <div class="total">
        <div class="total-label">3年間合計</div>
        <div class="total-value">1,040万円</div>
      </div>
    </div>
  </div>
  <div class="conclusion">→ SaaSの方が安い（約734万円の差）</div>
</div>
</body>
</html>
