<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaaSを選ぶべきケース</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .section { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; }
  .section.good { border-top: 4px solid #34a853; }
  .section.bad { border-top: 4px solid #d93025; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .section.good .section-title { color: #34a853; }
  .section.bad .section-title { color: #d93025; }
  .item { margin-bottom: 10px; }
  .item-title { font-size: 13px; font-weight: 600; color: #333; }
  .item-desc { font-size: 12px; color: #777; margin-top: 2px; }
</style>
</head>
<body>
<div id="diagram">
  <h2>PaaSを選ぶべきケース</h2>
  <div class="sections">
    <div class="section good">
      <div class="section-title">&#9675; こんな時はPaaS</div>
      <div class="item">
        <div class="item-title">1. すぐにサービスを立ち上げたい</div>
        <div class="item-desc">例: MVPを1週間で作る</div>
      </div>
      <div class="item">
        <div class="item-title">2. インフラエンジニアがいない</div>
        <div class="item-desc">例: Webエンジニアだけのチーム</div>
      </div>
      <div class="item">
        <div class="item-title">3. 小〜中規模のサイト</div>
        <div class="item-desc">例: 月間10〜100万PVのサイト</div>
      </div>
      <div class="item">
        <div class="item-title">4. スタートアップ</div>
        <div class="item-desc">例: ビジネス検証を優先</div>
      </div>
    </div>
    <div class="section bad">
      <div class="section-title">&#215; こんな時はPaaS以外</div>
      <div class="item">
        <div class="item-title">1. 特殊なカスタマイズが必要</div>
        <div class="item-desc">→ IaaSを使う</div>
      </div>
      <div class="item">
        <div class="item-title">2. 超大規模なシステム</div>
        <div class="item-desc">→ IaaSの方がコスト削減</div>
      </div>
      <div class="item">
        <div class="item-title">3. 既製品で十分</div>
        <div class="item-desc">→ SaaSを使う</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
