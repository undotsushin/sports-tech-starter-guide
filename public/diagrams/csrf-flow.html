<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #d32f2f; margin-bottom: 20px; text-align: center; }
.step { display: flex; align-items: flex-start; gap: 14px; padding: 10px 14px; background: #fff5f5; border-radius: 10px; border-left: 4px solid #ef5350; }
.step-num { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #d32f2f; color: #fff; font-size: 13px; font-weight: bold; flex-shrink: 0; }
.step-content { flex: 1; }
.step-title { font-size: 13px; font-weight: bold; color: #333; }
.step-desc { font-size: 12px; color: #666; margin-top: 2px; }
.code { font-family: 'Courier New', monospace; font-size: 11px; background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
.arrow { text-align: center; font-size: 20px; color: #d32f2f; padding: 3px 0; }
.step4 { background: #ffebee; border-left-color: #b71c1c; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>CSRF攻撃の流れ</h2>
  <div class="step"><span class="step-num">1</span><div class="step-content"><div class="step-title">ユーザーが銀行サイトにログイン中</div></div></div>
  <div class="arrow">↓</div>
  <div class="step"><span class="step-num">2</span><div class="step-content"><div class="step-title">攻撃者のサイトにアクセス</div></div></div>
  <div class="arrow">↓</div>
  <div class="step"><span class="step-num">3</span><div class="step-content"><div class="step-title">攻撃者のサイトに埋め込まれた悪意のあるリンク</div><div class="step-desc"><span class="code">&lt;img src="https://bank.com/transfer?to=攻撃者&amp;amount=100万円"&gt;</span></div></div></div>
  <div class="arrow">↓</div>
  <div class="step step4"><span class="step-num">4</span><div class="step-content"><div class="step-title">知らないうちに送金される</div><div class="step-desc">ログイン中なので、本人の操作として処理される</div></div></div>
</div>
</body>
</html>
