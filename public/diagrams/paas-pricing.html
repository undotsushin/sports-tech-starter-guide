<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料金比較（月間10万PV）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }
  .card:nth-child(1) { border-top: 4px solid #1a73e8; }
  .card:nth-child(2) { border-top: 4px solid #fbbc04; }
  .card-type { font-size: 11px; color: #777; margin-bottom: 2px; }
  .card-title { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 10px; }
  .card-price { font-size: 22px; font-weight: 700; color: #1a73e8; margin-bottom: 10px; }
  .card-specs { font-size: 12px; color: #555; line-height: 1.8; text-align: left; }
  .card-time { font-size: 12px; color: #777; margin-top: 8px; }
  .conclusion {
    background: #e8f0fe;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    color: #1a73e8;
    text-align: center;
  }
</style>
</head>
<body>
<div id="diagram">
  <h2>料金比較（月間10万PVのサイト）</h2>
  <div class="cards">
    <div class="card">
      <div class="card-type">PaaS</div>
      <div class="card-title">Heroku</div>
      <div class="card-price">月3,500円</div>
      <div class="card-specs">
        Dyno: Standard 1X<br>
        メモリ: 512MB
      </div>
      <div class="card-time">設定時間: 10分</div>
    </div>
    <div class="card">
      <div class="card-type">IaaS</div>
      <div class="card-title">AWS EC2</div>
      <div class="card-price">月2,000円+管理工数</div>
      <div class="card-specs">
        インスタンス: t3.small<br>
        メモリ: 2GB
      </div>
      <div class="card-time">設定時間: 3時間 + 運用時間</div>
    </div>
  </div>
  <div class="conclusion">→ 小規模ならPaaSの方が楽で安い</div>
</div>
</body>
</html>
