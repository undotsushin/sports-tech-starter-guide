<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaSのメリット</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #1a73e8; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px;
    border-left: 4px solid #1a73e8;
  }
  .card-num { font-size: 12px; color: #1a73e8; font-weight: 700; margin-bottom: 4px; }
  .card-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 6px; }
  .card-desc { font-size: 11px; color: #555; line-height: 1.5; }
  .card-arrow { font-size: 11px; color: #1a73e8; margin-top: 6px; }
</style>
</head>
<body>
<div id="diagram">
  <h2>SaaSのメリット</h2>
  <div class="cards">
    <div class="card">
      <div class="card-num">1</div>
      <div class="card-title">すぐに使える</div>
      <div class="card-desc">インストール不要、アカウント登録だけ</div>
      <div class="card-arrow">→ 5分で利用開始</div>
    </div>
    <div class="card">
      <div class="card-num">2</div>
      <div class="card-title">自動アップデート</div>
      <div class="card-desc">新機能が自動で追加、セキュリティも自動更新</div>
      <div class="card-arrow">→ 常に最新版を使える</div>
    </div>
    <div class="card">
      <div class="card-num">3</div>
      <div class="card-title">どこからでもアクセス</div>
      <div class="card-desc">PC、スマホ、タブレットから</div>
      <div class="card-arrow">→ リモートワークに最適</div>
    </div>
    <div class="card">
      <div class="card-num">4</div>
      <div class="card-title">初期費用が安い</div>
      <div class="card-desc">月額数百円〜数千円で利用可能</div>
      <div class="card-arrow">→ スタートアップに最適</div>
    </div>
    <div class="card">
      <div class="card-num">5</div>
      <div class="card-title">運用不要</div>
      <div class="card-desc">サーバー管理、バックアップ不要</div>
      <div class="card-arrow">→ IT部門がなくても使える</div>
    </div>
    <div class="card">
      <div class="card-num">6</div>
      <div class="card-title">スケーラブル</div>
      <div class="card-desc">ユーザー数に応じて柔軟に変更</div>
      <div class="card-arrow">→ 10人から10,000人まで対応</div>
    </div>
  </div>
</div>
</body>
</html>
