<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 20px; text-align: center; }
.flow { display: flex; flex-direction: column; gap: 0; }
.step { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #e3f2fd; border-radius: 10px; }
.step-num { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #1976d2; color: #fff; font-size: 16px; font-weight: bold; flex-shrink: 0; }
.step-text { font-size: 14px; color: #333; }
.arrow { text-align: center; font-size: 22px; color: #1976d2; padding: 4px 0; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>パスワード管理ツールの使い方</h2>
  <div class="flow">
    <div class="step"><span class="step-num">1</span><span class="step-text">パスワード管理ツールをインストール</span></div>
    <div class="arrow">↓</div>
    <div class="step"><span class="step-num">2</span><span class="step-text">マスターパスワードを設定（1つだけ覚える）</span></div>
    <div class="arrow">↓</div>
    <div class="step"><span class="step-num">3</span><span class="step-text">サービスごとのパスワードを登録</span></div>
    <div class="arrow">↓</div>
    <div class="step"><span class="step-num">4</span><span class="step-text">自動入力で楽々ログイン</span></div>
  </div>
</div>
</body>
</html>
