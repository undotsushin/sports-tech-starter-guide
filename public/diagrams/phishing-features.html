<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #d32f2f; margin-bottom: 16px; text-align: center; }
.item { margin-bottom: 12px; padding: 12px 16px; background: #fff5f5; border-radius: 10px; border-left: 4px solid #ef5350; }
.item:last-child { margin-bottom: 0; }
.item-num { font-size: 13px; font-weight: bold; color: #d32f2f; margin-bottom: 4px; }
.item-desc { font-size: 13px; color: #333; line-height: 1.6; }
.example { font-size: 12px; color: #666; margin-top: 4px; }
.bad { color: #d32f2f; font-family: 'Courier New', monospace; }
.good { color: #2e7d32; font-family: 'Courier New', monospace; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>フィッシングメールの特徴</h2>
  <div class="item">
    <div class="item-num">1. 送信元のドメインが微妙に違う</div>
    <div class="item-desc">
      <span class="bad">× amaz0n.com（ゼロ）</span><br>
      <span class="good">○ amazon.com（オー）</span>
    </div>
  </div>
  <div class="item">
    <div class="item-num">2. 緊急性を煽る文章</div>
    <div class="example">「24時間以内に対応しないとアカウント停止」<br>「不正利用されています」</div>
  </div>
  <div class="item">
    <div class="item-num">3. 日本語がおかしい</div>
    <div class="example">「あなたのアカウントは停止されました」<br>「直ちに確認して下さい」</div>
  </div>
  <div class="item">
    <div class="item-num">4. リンク先のURLが本物と違う</div>
    <div class="example">マウスを乗せてURLを確認する</div>
  </div>
</div>
</body>
</html>
