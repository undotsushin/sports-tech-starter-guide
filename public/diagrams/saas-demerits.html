<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaSのデメリット</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #diagram {
    padding: 24px;
    max-width: 680px;
  }
  h2 { font-size: 18px; color: #d93025; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px;
    border-left: 4px solid #d93025;
  }
  .card-num { font-size: 12px; color: #d93025; font-weight: 700; margin-bottom: 4px; }
  .card-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 6px; }
  .card-desc { font-size: 11px; color: #555; line-height: 1.5; }
  .card-arrow { font-size: 11px; color: #d93025; margin-top: 6px; }
</style>
</head>
<body>
<div id="diagram">
  <h2>SaaSのデメリット</h2>
  <div class="cards">
    <div class="card">
      <div class="card-num">1</div>
      <div class="card-title">カスタマイズできない</div>
      <div class="card-desc">自社の業務に完全に合わせられない</div>
      <div class="card-arrow">→ 業務をSaaSに合わせる必要</div>
    </div>
    <div class="card">
      <div class="card-num">2</div>
      <div class="card-title">データが外部にある</div>
      <div class="card-desc">自社サーバーにデータがない</div>
      <div class="card-arrow">→ セキュリティリスク</div>
    </div>
    <div class="card">
      <div class="card-num">3</div>
      <div class="card-title">月額料金が継続的</div>
      <div class="card-desc">使い続ける限り料金が発生</div>
      <div class="card-arrow">→ 長期的にはコスト高になる</div>
    </div>
    <div class="card">
      <div class="card-num">4</div>
      <div class="card-title">サービス終了のリスク</div>
      <div class="card-desc">サービスが終了したら使えない</div>
      <div class="card-arrow">→ データ移行が必要</div>
    </div>
    <div class="card">
      <div class="card-num">5</div>
      <div class="card-title">インターネット必須</div>
      <div class="card-desc">オフラインでは使えない</div>
      <div class="card-arrow">→ ネット環境が必須</div>
    </div>
  </div>
</div>
</body>
</html>
