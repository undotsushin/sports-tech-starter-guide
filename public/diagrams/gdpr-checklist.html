<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 16px; text-align: center; }
.items { list-style: none; }
.items li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 6px; background: #f5f5f5; border-radius: 8px; font-size: 14px; color: #333; }
.check { color: #1976d2; font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>GDPR対応チェックリスト</h2>
  <ul class="items">
    <li><span class="check">☐</span>Cookie同意バナーの表示</li>
    <li><span class="check">☐</span>データ削除権の対応</li>
    <li><span class="check">☐</span>データポータビリティ（データのエクスポート機能）</li>
    <li><span class="check">☐</span>72時間以内の漏洩報告義務</li>
    <li><span class="check">☐</span>プライバシーバイデザイン（設計段階からプライバシー配慮）</li>
  </ul>
</div>
</body>
</html>
