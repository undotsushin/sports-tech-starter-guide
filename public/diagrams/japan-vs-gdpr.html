<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本 vs EU(GDPR) 比較表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 28px 32px; max-width: 620px; width: 100%;
  }
  h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 18px; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #2d3748; color: #fff; font-size: 14px; font-weight: 600;
    padding: 10px 14px; text-align: left;
  }
  thead th:first-child { border-radius: 8px 0 0 0; }
  thead th:last-child { border-radius: 0 8px 0 0; }
  tbody td {
    padding: 10px 14px; font-size: 14px; color: #333; border-bottom: 1px solid #e8e8e8;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:last-child td:first-child { border-radius: 0 0 0 8px; }
  tbody tr:last-child td:last-child { border-radius: 0 0 8px 0; }
  .label { font-weight: 600; background: #f7fafc; }
  .jp { color: #2b6cb0; }
  .eu { color: #c53030; }
  .highlight { font-weight: 600; }
</style>
</head>
<body>
<div class="card" id="diagram">
  <h2>🇯🇵 日本 vs 🇪🇺 EU（GDPR）比較表</h2>
  <table>
    <thead>
      <tr><th>項目</th><th class="jp">日本</th><th class="eu">EU（GDPR）</th></tr>
    </thead>
    <tbody>
      <tr><td class="label">罰金</td><td>最大 <span class="highlight">1億円</span></td><td>最大 <span class="highlight eu">30億円</span></td></tr>
      <tr><td class="label">対象</td><td>日本国内</td><td>EU在住者</td></tr>
      <tr><td class="label">Cookie同意</td><td>推奨</td><td><span class="highlight eu">必須</span></td></tr>
      <tr><td class="label">データ削除権</td><td>あり</td><td><span class="highlight eu">強い権利</span></td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
