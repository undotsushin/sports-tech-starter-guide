<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #d32f2f; margin-bottom: 16px; text-align: center; }
.warning { background: #fff3e0; border-left: 4px solid #ff9800; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; color: #e65100; border-radius: 0 8px 8px 0; }
.list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
.item { display: flex; align-items: center; padding: 6px 10px; border-radius: 8px; background: #fafafa; border: 1px solid #eee; }
.rank { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #d32f2f; color: #fff; font-size: 13px; font-weight: bold; margin-right: 10px; flex-shrink: 0; }
.item:nth-child(-n+3) .rank { background: #b71c1c; }
.pw { font-family: 'Courier New', monospace; font-size: 15px; color: #333; }
.footer { text-align: center; margin-top: 14px; font-size: 13px; color: #d32f2f; font-weight: bold; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>絶対に使ってはいけないパスワード ワースト10</h2>
  <div class="warning">これらのパスワードは数秒で破られます</div>
  <div class="list">
    <div class="item"><span class="rank">1</span><span class="pw">123456</span></div>
    <div class="item"><span class="rank">6</span><span class="pw">12345</span></div>
    <div class="item"><span class="rank">2</span><span class="pw">password</span></div>
    <div class="item"><span class="rank">7</span><span class="pw">1234</span></div>
    <div class="item"><span class="rank">3</span><span class="pw">12345678</span></div>
    <div class="item"><span class="rank">8</span><span class="pw">111111</span></div>
    <div class="item"><span class="rank">4</span><span class="pw">qwerty</span></div>
    <div class="item"><span class="rank">9</span><span class="pw">1234567</span></div>
    <div class="item"><span class="rank">5</span><span class="pw">123456789</span></div>
    <div class="item"><span class="rank">10</span><span class="pw">dragon</span></div>
  </div>
</div>
</body>
</html>
