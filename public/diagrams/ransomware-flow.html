<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #d32f2f; margin-bottom: 20px; text-align: center; }
.step { display: flex; align-items: flex-start; gap: 14px; padding: 12px 14px; background: #fff5f5; border-radius: 10px; border-left: 4px solid #ef5350; }
.step-num { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #d32f2f; color: #fff; font-size: 14px; font-weight: bold; flex-shrink: 0; }
.step-content { flex: 1; }
.step-title { font-size: 14px; font-weight: bold; color: #d32f2f; margin-bottom: 2px; }
.step-desc { font-size: 13px; color: #555; }
.arrow { text-align: center; font-size: 22px; color: #d32f2f; padding: 4px 0; }
.step4 { background: #ffebee; border-left-color: #b71c1c; }
.step4 .step-title { color: #b71c1c; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>ランサムウェア攻撃の流れ</h2>
  <div class="step"><span class="step-num">1</span><div class="step-content"><div class="step-title">感染</div><div class="step-desc">メール添付ファイルを開く、または脆弱性のあるサーバーに侵入</div></div></div>
  <div class="arrow">↓</div>
  <div class="step"><span class="step-num">2</span><div class="step-content"><div class="step-title">ファイルが暗号化される</div><div class="step-desc">すべてのファイルが開けなくなる</div></div></div>
  <div class="arrow">↓</div>
  <div class="step"><span class="step-num">3</span><div class="step-content"><div class="step-title">身代金要求</div><div class="step-desc">「ビットコインで300万円払えば復号キーを渡す」</div></div></div>
  <div class="arrow">↓</div>
  <div class="step step4"><span class="step-num">4</span><div class="step-content"><div class="step-title">支払っても...</div><div class="step-desc">復号キーが渡される保証はない</div></div></div>
</div>
</body>
</html>
