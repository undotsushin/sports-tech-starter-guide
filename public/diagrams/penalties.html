<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #d32f2f; margin-bottom: 16px; text-align: center; }
.items { list-style: none; }
.items li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 6px; background: #fff5f5; border-left: 4px solid #ef5350; border-radius: 0 8px 8px 0; font-size: 14px; color: #333; }
.icon { font-size: 16px; color: #d32f2f; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>個人情報保護法の罰則</h2>
  <ul class="items">
    <li><span class="icon">⚠</span>法人: 最大1億円の罰金</li>
    <li><span class="icon">⚠</span>個人: 最大2年の懲役または100万円の罰金</li>
    <li><span class="icon">⚠</span>行政指導・命令</li>
    <li><span class="icon">⚠</span>社会的信用の失墜</li>
    <li><span class="icon">⚠</span>損害賠償請求</li>
  </ul>
</div>
</body>
</html>
