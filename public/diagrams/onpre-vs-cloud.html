<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 40px; background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
  .container { max-width: 560px; margin: 0 auto; display: flex; gap: 20px; }
  .card { flex: 1; border-radius: 12px; padding: 20px; }
  .card-onpre { background: #ffebee; border: 2px solid #c62828; }
  .card-cloud { background: #e3f2fd; border: 2px solid #1565c0; }
  .card-title { font-size: 15px; font-weight: bold; margin-bottom: 14px; text-align: center; }
  .title-onpre { color: #c62828; }
  .title-cloud { color: #1565c0; }
  .item { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 13px; color: #333; }
  .item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="container">
  <div class="card card-onpre">
    <div class="card-title title-onpre">オンプレミス</div>
    <div class="item">自社でサーバー購入</div>
    <div class="item">初期費用: 数百万円</div>
    <div class="item">設置場所が必要</div>
    <div class="item">故障したら自分で対応</div>
  </div>
  <div class="card card-cloud">
    <div class="card-title title-cloud">クラウド</div>
    <div class="item">月額で借りる</div>
    <div class="item">初期費用: 0円</div>
    <div class="item">設置場所不要</div>
    <div class="item">故障時も自動対応</div>
  </div>
</div>
</body>
</html>
