<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 30px; background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
  .container { max-width: 520px; margin: 0 auto; display: flex; gap: 16px; }
  .card { flex: 1; border-radius: 10px; padding: 16px; }
  .card-scratch { background: #fff3e0; border: 2px solid #e65100; }
  .card-template { background: #e3f2fd; border: 2px solid #1565c0; }
  .card-title { font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 4px; }
  .title-scratch { color: #e65100; }
  .title-template { color: #1565c0; }
  .card-sub { font-size: 11px; color: #888; text-align: center; margin-bottom: 12px; }
  .item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 12px; color: #333; }
  .item:last-child { border-bottom: none; }
  .val { font-weight: bold; }
</style>
</head>
<body>
<div class="container" id="diagram">
  <div class="card card-scratch">
    <div class="card-title title-scratch">フルスクラッチ</div>
    <div class="card-sub">完全オリジナル</div>
    <div class="item"><span>費用</span><span class="val">300万円</span></div>
    <div class="item"><span>期間</span><span class="val">4ヶ月</span></div>
    <div class="item"><span>デザイン</span><span class="val">完全自由</span></div>
    <div class="item"><span>独自性</span><span class="val">高い</span></div>
  </div>
  <div class="card card-template">
    <div class="card-title title-template">テンプレート活用</div>
    <div class="card-sub">既存デザイン利用</div>
    <div class="item"><span>費用</span><span class="val">150万円（50%削減）</span></div>
    <div class="item"><span>期間</span><span class="val">2ヶ月（半分）</span></div>
    <div class="item"><span>デザイン</span><span class="val">ある程度制限</span></div>
    <div class="item"><span>独自性</span><span class="val">低い</span></div>
  </div>
</div>
</body>
</html>
