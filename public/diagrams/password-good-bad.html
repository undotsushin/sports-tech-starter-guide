<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 28px 32px; width: 640px; }
h2 { font-size: 18px; color: #333; margin-bottom: 16px; text-align: center; }
.examples { display: flex; gap: 16px; margin-bottom: 20px; }
.bad, .good { flex: 1; border-radius: 10px; padding: 14px; }
.bad { background: #ffebee; border: 2px solid #ef5350; }
.good { background: #e8f5e9; border: 2px solid #66bb6a; }
.label { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
.bad .label { color: #d32f2f; }
.good .label { color: #2e7d32; }
.pw { font-family: 'Courier New', monospace; font-size: 15px; color: #333; word-break: break-all; }
h3 { font-size: 15px; color: #333; margin-bottom: 10px; }
.conditions { list-style: none; }
.conditions li { padding: 6px 0; font-size: 14px; color: #444; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
.conditions li:last-child { border-bottom: none; }
.num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #1976d2; color: #fff; font-size: 12px; font-weight: bold; margin-right: 8px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card" id="target">
  <h2>強いパスワードの条件</h2>
  <div class="examples">
    <div class="bad">
      <div class="label">× 悪い例</div>
      <div class="pw">password123</div>
    </div>
    <div class="good">
      <div class="label">○ 良い例</div>
      <div class="pw">Kj8$mP2#qL9@nR4!</div>
    </div>
  </div>
  <h3>強いパスワードの条件</h3>
  <ul class="conditions">
    <li><span class="num">1</span>12文字以上</li>
    <li><span class="num">2</span>大文字・小文字・数字・記号を含む</li>
    <li><span class="num">3</span>辞書にある単語を使わない</li>
    <li><span class="num">4</span>個人情報を含めない（誕生日、名前など）</li>
    <li><span class="num">5</span>サービスごとに違うパスワードを使う</li>
  </ul>
</div>
</body>
</html>
